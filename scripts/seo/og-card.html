<!doctype html>
<!--
  The source for /og.png — the card that appears when the site is linked on social or in chat.

  It is a real page rather than an image file so it can use the site's own typefaces and tokens.
  To regenerate: serve the built site, open this page at a 1200x630 viewport, and screenshot it.
  The body is fixed at exactly 1200x630 so the screenshot needs no cropping.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Open Graph card</title>
    <style>
      @font-face {
        font-family: 'Newsreader';
        font-style: italic;
        font-weight: 400 500;
        src: url('/fonts/newsreader-var-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Newsreader';
        font-style: normal;
        font-weight: 400 600;
        src: url('/fonts/newsreader-var.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        src: url('/fonts/ibm-plex-mono-400.woff2') format('woff2');
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #f4f1ea;
        color: #1c1a17;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        box-sizing: border-box;
        position: relative;
      }

      .brand {
        font-family: 'Newsreader', Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: 40px;
        letter-spacing: -0.01em;
        margin-bottom: 30px;
      }

      h1 {
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 500;
        font-size: 82px;
        line-height: 1.02;
        letter-spacing: -0.025em;
        margin: 0 0 28px;
        max-width: 15ch;
      }

      p {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 19px;
        line-height: 1.7;
        color: #5f5950;
        margin: 0;
        letter-spacing: 0.01em;
      }

      /* The three methods, as a rule the eye reads left to right along the bottom. */
      .rule {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 74px;
        border-top: 1px solid #1c1a17;
        padding-top: 18px;
        display: flex;
        gap: 34px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #1c1a17;
      }
      .rule span:first-child {
        color: #1f5c3f;
      }

      /* A single card, bled off the right edge — enough to say "blackjack" without a stock photo. */
      .card {
        position: absolute;
        right: -54px;
        top: 96px;
        width: 268px;
        height: 380px;
        background: #fbf9f3;
        border: 1px solid #d9d3c7;
        border-radius: 14px;
        transform: rotate(7deg);
        box-sizing: border-box;
        padding: 26px 30px;
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 500;
      }
      .card .pip {
        font-size: 56px;
        line-height: 1;
        color: #1c1a17;
      }
      .card .suit {
        font-size: 44px;
        line-height: 1.1;
        color: #b8352f;
      }
      .card .big {
        position: absolute;
        left: 30px;
        bottom: 26px;
        font-size: 150px;
        line-height: 1;
        color: #1f5c3f;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <div class="brand">Twenty-One</div>
    <h1>Learn to play 21 properly.</h1>
    <p>Free blackjack trainer &middot; no signup &middot; no real money</p>

    <div class="card">
      <div class="pip">A</div>
      <div class="suit">&hearts;</div>
      <div class="big">21</div>
    </div>

    <div class="rule">
      <span>Basic strategy</span>
      <span>Hi-Lo counting</span>
      <span>Illustrious 18</span>
    </div>
  </body>
</html>
