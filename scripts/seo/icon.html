<!doctype html>
<!-- Source for /apple-touch-icon.png. iOS rounds the corners itself, so the tile bleeds to the
     edge. Regenerate with scripts/make-images.sh. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #1f5c3f; }
      body { width: 180px; height: 180px; display: grid; place-items: center; }
      span {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 104px; font-weight: 500; letter-spacing: -3px; color: #f4f1ea;
        line-height: 1; transform: translateY(-2px);
      }
    </style>
  </head>
  <body><span>21</span></body>
</html>
