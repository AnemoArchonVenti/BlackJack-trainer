<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Twenty-One">
  <!--
    The site mark. It appears in the browser tab, in bookmarks, and beside the result in Google's
    mobile search listings, so it has to survive being drawn at 16 pixels: one shape, one word,
    two colours from the palette and nothing else.

    The numerals are set in the serif stack rather than the site's webfont — an SVG favicon is
    rendered by the browser chrome, which will not load a webfont for it. Georgia and Times both
    cut a "21" close enough to Newsreader's for the mark to read as the same family.
  -->
  <rect width="64" height="64" rx="13" fill="#1f5c3f"/>
  <text
    x="32" y="45"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', 'Noto Serif', serif"
    font-size="38"
    font-weight="500"
    letter-spacing="-1"
    fill="#f4f1ea"
  >21</text>
</svg>
